name: simplex-smp-server-yggdrasil-clearnet

services:
  # 0. Yggdrasil node: exposes the SMP server on the node's Yggdrasil (200::/7) address
  yggdrasil:
    image: alpine:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - YGG_PRIV_KEY=${YGG_PRIV_KEY:?YGG_PRIV_KEY is required}
      - YGG_PEERS=${YGG_PEERS:?YGG_PEERS is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache yggdrasil socat

        echo "Generating base config..."
        mkdir -p /etc/yggdrasil
        yggdrasil -genconf > /etc/yggdrasil/yggdrasil.conf
        if [ -n "$$YGG_PRIV_KEY" ]; then
          sed -i "s|^\s*PrivateKey:.*|  PrivateKey: $$YGG_PRIV_KEY|g" /etc/yggdrasil/yggdrasil.conf
        fi
        if [ -n "$$YGG_PEERS" ]; then
          LIST=""
          for p in $$YGG_PEERS; do LIST="$$LIST \"$$p\","; done
          sed -i "s|Peers:\s*\[.*\]|Peers: [$$LIST]|g" /etc/yggdrasil/yggdrasil.conf
        fi

        yggdrasil -useconffile /etc/yggdrasil/yggdrasil.conf &

        echo "Starting socat proxies..."
        # Server information page (plain HTTP over Yggdrasil)
        socat TCP6-LISTEN:80,fork,reuseaddr TCP4:caddy:80 &
        # SMP protocol ports
        socat TCP6-LISTEN:${SMP_PORT_HTTPS:-443},fork,reuseaddr TCP4:smp-server:${SMP_PORT_HTTPS:-443} &
        exec socat TCP6-LISTEN:${SMP_PORT_TRANSPORT:-5223},fork,reuseaddr TCP4:smp-server:${SMP_PORT_TRANSPORT:-5223}

  # 1. Caddyfile Initialization (always regenerated, so switching from docker-compose.yml picks up the Yggdrasil block)
  oneshot:
    image: ubuntu:latest
    env_file:
      - .env
    environment:
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/caddy
        cat <<EOF > /etc/caddy/Caddyfile
        {
            acme_ca $$ACME_CA
        }

        http://$$SMP_ADDR {
            redir https://$$SMP_ADDR{uri} permanent
        }

        http:// {
            reverse_proxy https://smp-server:$$SMP_PORT_HTTPS {
                header_up Host $$SMP_ADDR
                transport http {
                    tls_server_name $$SMP_ADDR
                    tls_insecure_skip_verify
                }
            }
        }

        $$SMP_ADDR:8443 {
            tls {
                key_type rsa4096
            }
        }
        EOF
    volumes:
      - ./caddy_conf:/etc/caddy

  # 2. Caddy (Let's Encrypt certificates management)
  caddy:
    image: caddy:latest
    depends_on:
      oneshot:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    environment:
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./caddy_conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: test -f "/data/caddy/certificates/$$(echo "$$ACME_CA" | sed -E 's#^[a-zA-Z]+://##; s#/+$$##; s#[/:]#-#g' | tr 'A-Z' 'a-z')/$$SMP_ADDR/$$SMP_ADDR.crt"
      interval: 1s
      retries: 60

  # 3. SMP Server (dynamic INI generation and startup)
  smp-server:
    image: simplexchat/smp-server:v7.0.1
    depends_on:
      caddy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Base settings (can be overridden in .env)
      ADDR: ${SMP_ADDR}
      SMP_CFG__TRANSPORT__host: ${SMP_ADDR}
      SMP_CFG__TRANSPORT__port: "${SMP_PORT_TRANSPORT},${SMP_PORT_HTTPS}"
      SMP_CFG__WEB__https: "${SMP_PORT_HTTPS}"
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      SMP_CFG__WEB__static_path: "/var/opt/simplex/www"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/opt/simplex /var/opt/simplex

        if [ ! -f /etc/opt/simplex/fingerprint ]; then
            echo "Initializing keys and fingerprint..."
            smp-server init --yes
        fi

        CERT_DIR="/caddy/caddy/certificates/$$(echo "$$ACME_CA" | sed -E 's#^[a-zA-Z]+://##; s#/+$$##; s#[/:]#-#g' | tr 'A-Z' 'a-z')/$$SMP_ADDR"
        export SMP_CFG__WEB__cert="$$CERT_DIR/$$SMP_ADDR.crt"
        export SMP_CFG__WEB__key="$$CERT_DIR/$$SMP_ADDR.key"

        echo "Generating smp-server.ini from environment variables..."

        env | grep '^SMP_CFG__' | sort | awk -F '=' '{
            var = $$1
            val = substr($$0, length(var) + 2)

            # Skip empty values
            if (val == "") next

            # Parse section and key names
            sub(/^SMP_CFG__/, "", var)
            split(var, parts, "__")
            section = parts[1]
            key = parts[2]

            if (section != last_section) {
                print "\n[" section "]"
                last_section = section
            }
            print key ": " val
        }' > /etc/opt/simplex/smp-server.ini

        echo "Starting SMP server..."
        exec smp-server start +RTS -N -RTS
    volumes:
      - ./smp_configs:/etc/opt/simplex
      - ./smp_state:/var/opt/simplex
      # Caddy data volume (TLS certificates for the information page)
      - caddy_data:/caddy:ro
    ports:
      - "${SMP_PORT_TRANSPORT}:${SMP_PORT_TRANSPORT}"
      - "${SMP_PORT_HTTPS}:${SMP_PORT_HTTPS}"
    restart: unless-stopped

  # Ready-to-use server addresses, one per line:
  #   SIMPLEX_ADDRESS <network> <smp|info> <address>
  # Printed to the logs (docker compose logs addresses) and saved to ./addresses.txt
  addresses:
    image: alpine:latest
    depends_on:
      smp-server:
        condition: service_started
    env_file:
      - .env
    environment:
      - YGG_PRIV_KEY=${YGG_PRIV_KEY:?YGG_PRIV_KEY is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until [ -s /etc/opt/simplex/fingerprint ]; do
          i=$$((i + 1))
          if [ $$i -gt 300 ]; then echo "Fingerprint not found in /etc/opt/simplex" >&2; exit 1; fi
          sleep 1
        done
        FP=$$(cat /etc/opt/simplex/fingerprint)
        apk add --no-cache yggdrasil > /dev/null
        printf '{"PrivateKey":"%s"}' "$$YGG_PRIV_KEY" > /tmp/yggdrasil.conf
        YGG=$$(yggdrasil -useconffile /tmp/yggdrasil.conf -address)
        [ "$$SMP_PORT_TRANSPORT" = 5223 ] && PORT="" || PORT=":$$SMP_PORT_TRANSPORT"
        [ "$$SMP_PORT_HTTPS" = 443 ] && WEB_PORT="" || WEB_PORT=":$$SMP_PORT_HTTPS"
        {
          echo "SIMPLEX_ADDRESS clearnet smp smp://$$FP@$$SMP_ADDR$$PORT"
          echo "SIMPLEX_ADDRESS clearnet info https://$$SMP_ADDR$$WEB_PORT/"
          echo "SIMPLEX_ADDRESS yggdrasil smp smp://$$FP@[$$YGG]$$PORT"
          echo "SIMPLEX_ADDRESS yggdrasil info http://[$$YGG]/"
        } | tee /deploy/addresses.txt
    volumes:
      - ./smp_configs:/etc/opt/simplex:ro
      - ./:/deploy

volumes:
  caddy_data:
  caddy_config:
