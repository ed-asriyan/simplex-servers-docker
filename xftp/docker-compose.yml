name: simplex-xftp-server

services:
  oneshot:
    image: ubuntu:latest
    env_file:
      - .env
    environment:
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/caddy
        if [ ! -f /etc/caddy/Caddyfile ]; then
          cat <<EOF > /etc/caddy/Caddyfile
        {
            acme_ca $$ACME_CA
        }

        http://$$XFTP_ADDR {
            redir https://$$XFTP_ADDR{uri} permanent
        }

        $$XFTP_ADDR:8443 {
            tls {
                key_type rsa4096
            }
        }
        EOF
        fi
    volumes:
      - ./caddy_conf:/etc/caddy

  caddy:
    image: caddy:latest
    depends_on:
      oneshot:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    environment:
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./caddy_conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: test -f "/data/caddy/certificates/$$(echo "$$ACME_CA" | sed -E 's#^[a-zA-Z]+://##; s#/+$$##; s#[/:]#-#g' | tr 'A-Z' 'a-z')/$$XFTP_ADDR/$$XFTP_ADDR.crt"
      interval: 1s
      retries: 60

  xftp-server:
    image: simplexchat/xftp-server:v7.0.1
    depends_on:
      caddy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ADDR: ${XFTP_ADDR}
      XFTP_CFG__TRANSPORT__host: ${XFTP_ADDR}
      XFTP_CFG__TRANSPORT__port: "${XFTP_PORT_HTTPS}"
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      XFTP_CFG__WEB__static_path: "/var/opt/simplex/www"
      XFTP_CFG__FILES__path: "/files"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /etc/opt/simplex-xftp/fingerprint ]; then
            echo "Initializing keys and fingerprint..."
            # will be rewritten with actual IP and quota
            xftp-server init --ip 127.0.0.1 --quota 1gb --path /files
        fi
        
        CERT_DIR="/caddy/caddy/certificates/$$(echo "$$ACME_CA" | sed -E 's#^[a-zA-Z]+://##; s#/+$$##; s#[/:]#-#g' | tr 'A-Z' 'a-z')/$$XFTP_ADDR"
        export XFTP_CFG__WEB__cert="$$CERT_DIR/$$XFTP_ADDR.crt"
        export XFTP_CFG__WEB__key="$$CERT_DIR/$$XFTP_ADDR.key"

        echo "Generating file-server.ini from environment variables..."
        
        env | grep '^XFTP_CFG__' | sort | awk -F '=' '{
            var = $$1
            val = substr($$0, length(var) + 2)
            
            # Skip empty values
            if (val == "") next
            
            # Parse section and key names
            sub(/^XFTP_CFG__/, "", var)
            split(var, parts, "__")
            section = parts[1]
            key = parts[2]
            
            if (section != last_section) {
                print "\n[" section "]"
                last_section = section
            }
            print key ": " val
        }' > /etc/opt/simplex-xftp/file-server.ini
        
        echo "Starting XFTP server..."
        exec xftp-server start +RTS -N -RTS
    volumes:
      - ./xftp_configs:/etc/opt/simplex-xftp
      - ./xftp_state:/var/opt/simplex-xftp
      - ./xftp_files:/files
      # Caddy data volume (TLS certificates for the information page)
      - caddy_data:/caddy:ro
    ports:
      - "${XFTP_PORT_HTTPS}:${XFTP_PORT_HTTPS}"
    restart: unless-stopped

  # Ready-to-use server addresses, one per line:
  #   SIMPLEX_ADDRESS <network> <xftp|info> <address>
  # Printed to the logs (docker compose logs addresses) and saved to ./addresses.txt
  addresses:
    image: alpine:latest
    depends_on:
      xftp-server:
        condition: service_started
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until [ -s /etc/opt/simplex-xftp/fingerprint ]; do
          i=$$((i + 1))
          if [ $$i -gt 300 ]; then echo "Fingerprint not found in /etc/opt/simplex-xftp" >&2; exit 1; fi
          sleep 1
        done
        FP=$$(cat /etc/opt/simplex-xftp/fingerprint)
        [ "$$XFTP_PORT_HTTPS" = 443 ] && PORT="" || PORT=":$$XFTP_PORT_HTTPS"
        [ "$$XFTP_PORT_HTTPS" = 443 ] && WEB_PORT="" || WEB_PORT=":$$XFTP_PORT_HTTPS"
        {
          echo "SIMPLEX_ADDRESS clearnet xftp xftp://$$FP@$$XFTP_ADDR$$PORT"
          echo "SIMPLEX_ADDRESS clearnet info https://$$XFTP_ADDR$$WEB_PORT/"
        } | tee /deploy/addresses.txt
    volumes:
      - ./xftp_configs:/etc/opt/simplex-xftp:ro
      - ./:/deploy

volumes:
  caddy_data:
  caddy_config:
